  --ok:#3ccf91; --ko:#ff6b57; --warn:#f0b04a; --acc:#6b9bff; --acc-ink:#0b1220; --ring:rgba(107,155,255,.35); --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25); } }

:root[data-con="alto"] { --soft:color-mix(in srgb,var(--ink) 82%,var(--bg)); --line:color-mix(in srgb,var(--ink) 42%,var(--bg)); } :root[data-con="alto"] .card { border-width:2px; }

body[data-sfondo="oceano"] { background:linear-gradient(180deg, color-mix(in srgb,#2dd4ff 22%,var(--bg)), color-mix(in srgb,#2563eb 28%,var(--bg)) 60%, color-mix(in srgb,#0b1f4a 40%,var(--bg))); }

:root[data-ogg="falo"] .mc [data-o="falo"], :root[data-ogg="caffe"] .mc [data-o="caffe"], :root[data-ogg="pianta"] .mc [data-o="pianta"], :root[data-ogg="laptop"] .mc [data-o="laptop"], :root[data-ogg="musica"] .mc [data-o="musica"], :root[data-ogg="luna"] .mc [data-o="luna"], :root[data-ogg="regalo"] .mc [data-o="regalo"] { display:inline; }

@keyframes mcocurio { 0%,12%,52%,100% { transform:translateX(0); } 20%,36% { transform:translateX(-.9px); } 60%,76% { transform:translateX(.9px); } } @keyframes mcsogno { 0%,100% { transform:translateY(0); } 45%,60% { transform:translateY(-.9px); } } @keyframes mcpazzo { 0%,100% { transform:translate(0,0); } 25% { transform:translate(.7px,-.4px); } 50% { transform:translate(-.7px,.4px); } 75% { transform:translate(.5px,.5px); } } @keyframes mcocchio { 0%,82%,100% { transform:scaleY(1); } 88%,94% { transform:scaleY(.12); } }

#mcBolla { opacity:0; visibility:hidden; } #mcBolla.on { visibility:visible; animation:mcbolla 6s ease-out forwards; } @keyframes mcbolla { 0% { opacity:0; transform:translateY(6px); } 6%,88% { opacity:1; transform:none; visibility:visible; } 100% { opacity:0; visibility:hidden; } }
body.mini #compagno { display:none; } :root:is([data-mas="compagno"],[data-mas="entrambe"]) body.mini #compagno { display:flex; top:8px; bottom:auto; right:14px; } body.mini #compagno .mc { width:48px !important; pointer-events:none; } body.mini #mcBolla, body.mini #compagno [data-o] { display:none !important; }

/* struttura */
#app { animation:apri .45s cubic-bezier(.2,.7,.2,1) .15s backwards; display:grid; grid-template-columns:196px 1fr; grid-template-rows:54px 1fr; height:100vh; }
#top { grid-column:1 / -1; display:flex; align-items:center; gap:10px; padding:0 14px 0 86px; background:var(--side); border-bottom:1px solid var(--line); -webkit-user-select:none; user-select:none; cursor:default; }
#top .tit { font-weight:650; font-size:14px; }
#top .stato { display:flex; align-items:center; gap:7px; padding:3px 10px; border-radius:20px; background:var(--chip); font-size:12px; }
.pallino { width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
.pallino.pulsa { animation:pulsa 2s ease-in-out infinite; }
@keyframes pulsa { 50% { box-shadow:0 0 0 5px transparent; } 0% { box-shadow:0 0 0 0 var(--ring); } }
.spazio { flex:1; }
#ticker { flex:1 1 0; min-width:0; overflow:hidden; white-space:nowrap; font-size:12px; color:var(--soft); -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent); mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent); }
#tkPista { display:inline-block; padding-left:100%; animation:tkscorri var(--tk,40s) linear infinite; } #ticker:hover #tkPista { animation-play-state:paused; }
#tkPista.fermo { animation:none; padding-left:0; } #tkPista .tk { margin-right:44px; } #tkPista .tk b { color:var(--ink); font-weight:600; margin-right:6px; }
@keyframes tkscorri { from { transform:translateX(0); } to { transform:translateX(-100%); } }
@media (max-width: 640px) { #ticker { display:none; } }

#top button { -webkit-user-select:none; }
#nav { background:var(--side); border-right:1px solid var(--line); padding:12px 10px; display:flex; flex-direction:column; gap:3px; overflow:auto; }
#nav button { display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; background:transparent; padding:8px 10px; border-radius:8px; color:var(--soft); }
#nav button:hover { background:var(--chip); color:var(--ink); }
#nav button.on { background:var(--card); color:var(--ink); font-weight:600; box-shadow:var(--shadow); }
#nav svg { width:17px; height:17px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
#nav .badge { margin-left:auto; min-width:19px; text-align:center; padding:0 6px; border-radius:10px; background:var(--ko); color:#fff; font-size:11px; font-weight:600; }
#nav .badge.neutro { background:var(--chip); color:var(--soft); }
#nav .fondo { margin-top:auto; padding:8px 10px; font-size:11px; color:var(--soft); }
#cont { overflow:auto; padding:18px 20px 40px; }
.pag { display:none; max-width:1200px; margin:0 auto; animation:entra .2s ease-out; } .pag.on { display:block; }
@keyframes apri { from { opacity:0; transform:translateY(10px) scale(.985); } }
@keyframes entra { from { opacity:0; transform:translateY(8px); } }
.pag > h2.titolo { margin:0 0 14px; font-size:20px; font-weight:650; display:flex; align-items:center; gap:10px; }

<div id="app">
  <header id="top"><h1 class="tit" style="margin:0">PlanAIBoard</h1>
    <span class="seg" id="segTema" title="Tema"><button data-t="auto" data-tr="asp.auto-breve">Auto</button><button data-t="light" data-tr="asp.chiaro">Chiaro</button><button data-t="dark" data-tr="asp.scuro">Scuro</button></span>

<script src="/i18n.js"></script>
<script>
const G = "__GETTONE__";
function vai(p) {
  if (p === "sistema") { const f = document.getElementById("frSistema"); if (!f.src) f.src = f.dataset.src; }
  document.querySelectorAll(".pag").forEach(x => x.classList.toggle("on", x.id === "p-" + p));
  document.querySelectorAll("#nav button[data-p]").forEach(x => x.classList.toggle("on", x.dataset.p === p));
}
document.querySelectorAll("#nav button[data-p]").forEach(b => b.onclick = () => vai(b.dataset.p));
function applicaTema(t) {
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  document.querySelectorAll("#segTema button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  try { localStorage.setItem("pannello.tema", t); } catch (e) {}
}
document.querySelectorAll("#segTema button").forEach(b => b.onclick = () => applicaTema(b.dataset.t));
let t0 = "auto"; try { t0 = localStorage.getItem("pannello.tema") || "auto"; } catch (e) {} applicaTema(t0);
async function avvio() {
  try {
    const r = await (await fetch("/riassunto")).json(), a = r.aspetto, R = document.documentElement;
    R.style.setProperty("--acc", a.colore); R.style.setProperty("--blu", a.colore);
    await I18N.init(a.lingua); I18N.applica();
    document.title = a.titolo; document.querySelector("#top h1.tit").textContent = a.titolo;
    const hp = document.getElementById("hProg"), mk = (t, f) => { const b = document.createElement("button"), n = document.createElement("b"); n.textContent = t; b.append(n); b.onclick = f; return b; };
    hp.replaceChildren(...r.programmi.filter(p => p.trovato).map(p => { const d = document.createElement("div"); d.className = "pr" + (p.agganciato ? "" : " off"); const b = document.createElement("span"); b.className = "pb"; b.style.background = p.colore; b.textContent = p.nome[0]; const n = document.createElement("span"); n.textContent = p.nome + (p.agganciato ? " ✓" : ""); d.append(b, n); return d; }).concat(r.programmi.some(p => p.agganciato) ? [] : [Object.assign(document.createElement("p"), { className: "soft", textContent: I18N.t("h.nessuno") })]));
    document.getElementById("hCart").textContent = r.cartelle;
    document.getElementById("hColl").textContent = r.collegamenti ? r.collegamenti.file + " " + I18N.t("h.file") + " · " + r.collegamenti.progetti + " " + I18N.t("h.progetti") : I18N.t("h.nocoll");
    const az = [], via = (tipo, x) => fetch("/sistema/azione", { method: "POST", headers: { "Content-Type": "application/json", "X-Gettone": G }, body: JSON.stringify(Object.assign({ tipo }, x)) });
    r.programmi.filter(p => p.trovato && p.attivo && p.avviabile).forEach(p => az.push(mk(I18N.t("az2.apri").replace("{nome}", p.nome), () => via("programma", { id: p.id }))));
    if (r.ha_collegamenti) az.push(mk(I18N.t("az2.coll"), () => via("file", { chiave: "collegamenti" })));
    az.push(mk(I18N.t("az2.imp"), () => via("file", { chiave: "impostazioni" })));
    document.getElementById("azNL").replaceChildren(...az); az.forEach((b, i) => b.style.setProperty("--i", i));
  } catch (e) {}
}
const $ = id => document.getElementById(id);
    { const az = $("azRap"), tutti = () => [...az.querySelectorAll(".lancio button, #pannBtns button")];
      tutti().forEach((b, i) => b.style.setProperty("--i", i));
      // La tendina cresce/si abbassa insieme alle voci: "Azioni rapide" sale in apertura, scende per prima in chiusura
      const muovi = (apri) => {
        const bs = tutti(), passo = apri ? 60 : 50, base = apri ? 300 : 220;
        const cs = [...az.querySelectorAll(".lancio, #pannBtns")];
        cs.forEach(c => { const n = c.querySelectorAll("button").length, primo = bs.indexOf(c.querySelector("button")), H = c.offsetHeight, M = getComputedStyle(c).marginTop;
          const dur = n * passo + base - passo, rit = primo * passo;
          c.style.overflow = "hidden"; c.style.height = (apri ? 0 : H) + "px"; c.style.marginTop = apri ? "0px" : M; void c.offsetHeight;
          c.style.transition = "height " + dur + "ms linear " + rit + "ms, margin-top " + dur + "ms linear " + rit + "ms";
          c.style.height = (apri ? H : 0) + "px"; c.style.marginTop = apri ? M : "0px"; });
        const tot = (bs.length - 1) * passo + base;
        setTimeout(() => { cs.forEach(c => c.removeAttribute("style")); if (!apri) { az.open = false; az.classList.remove("chiude"); } }, tot + 30);
        return tot;
      };
      // Chiusura: ogni voce si accorcia da sola partendo dall'alto, cosi' "Azioni rapide" scende subito e segue le voci che spariscono
      const chiudi = () => {
        const bs = tutti(), passo = 60, base = 300;
        bs.forEach(b => b.style.setProperty("--h", b.offsetHeight + "px"));
        az.classList.add("chiude");
        [...az.querySelectorAll(".lancio, #pannBtns")].forEach(c => { const n = c.querySelectorAll("button").length, primo = bs.indexOf(c.querySelector("button")); c.style.transition = "margin-top " + base + "ms linear " + ((primo + n - 1) * passo) + "ms"; c.style.marginTop = "0px"; });
        setTimeout(() => { az.open = false; az.classList.remove("chiude"); az.querySelectorAll(".lancio, #pannBtns").forEach(c => c.removeAttribute("style")); bs.forEach(b => b.style.removeProperty("--h")); }, (bs.length - 1) * passo + base + 30);
      };
      let opening = false;
      az.querySelector("summary").addEventListener("click", (e) => {
        if (az.classList.contains("chiude")) { e.preventDefault(); return; }
        if (az.open) { e.preventDefault(); chiudi(); } else { opening = true; }
      });
      az.addEventListener("toggle", () => { if (az.open && opening) { opening = false; muovi(true); } });
    }

avvio(); setInterval(avvio, 30000); document.getElementById("bAggiorna").onclick = avvio;
addEventListener("message", e => { if (e.data === "sistema-salvato") avvio(); });
</script>
